[package]
name = "clash-tools"
description = "Mod linter, schema dump, headless runner, world viewer and benchmarks."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
clash-core.workspace = true
clash-time.workspace = true
clash-expr.workspace = true
clash-data.workspace = true
clash-world.workspace = true
clash-gen.workspace = true
clash-sim.workspace = true
clash-save.workspace = true
clash-scene.workspace = true
clash-front-term.workspace = true
# The window frontend's renderer alone, for its benchmark: without the
# `window` feature no window system is built (decision D-841).
clash-front-window = { path = "../clash-front-window", default-features = false }

[dev-dependencies]
serde.workspace = true

[lints]
workspace = true
