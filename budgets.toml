# The budgets of the specifications that have a benchmark (14 §6.3).
#
# Each `[[budget]]` is one row of the budget table at the end of a
# specification: `spec` names the document and section, `row` is the
# row's first column word for word (a test checks it against the
# document), `limit` its target, and `bench` the benchmark of
# `clash-tools bench` that measures it. `margin` is the share of the
# limit a measurement may exceed it by before `cargo xtask bench --check`
# fails. When a target is replaced by a measured figure, the
# specification's table and this file change together.
#
# Run the benchmarks with `cargo xtask bench` (all of them, in release)
# or `cargo xtask bench <filter>`. They are not part of `cargo xtask
# check`: they take minutes, and their figures depend on the machine.

# ---- 02 §25, the world -------------------------------------------------

[[budget]]
bench = "world.cell_flag_read"
spec = "02 §25"
row = "Cell flag read"
limit = "10 ns"
margin = 0.5

[[budget]]
bench = "world.cell_state_read"
spec = "02 §25"
row = "Cell state read"
limit = "30 ns"
margin = 0.5

[[budget]]
bench = "world.realize_city_tract"
spec = "02 §25"
row = "Realize a `test_city` tract"
limit = "2 ms"
margin = 0.25

[[budget]]
bench = "world.field_step"
spec = "02 §25"
row = "Field step, 50,000 active cells"
limit = "5 ms"
margin = 0.25

# ---- 09 §19, minds and paths ---------------------------------------------

[[budget]]
