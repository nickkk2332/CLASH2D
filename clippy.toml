    { path = "f32::atan", reason = "not bit-identical across platforms; use clash_core::Real::atan2 (01 §4)" },
    { path = "f32::atan2", reason = "not bit-identical across platforms; use clash_core::Real::atan2 (01 §4)" },
    { path = "f32::sinh", reason = "not bit-identical across platforms; use clash_core::Real (01 §4)" },
    { path = "f32::cosh", reason = "not bit-identical across platforms; use clash_core::Real (01 §4)" },
    { path = "f32::tanh", reason = "not bit-identical across platforms; use clash_core::Real (01 §4)" },
    { path = "f32::asinh", reason = "not bit-identical across platforms; use clash_core::Real (01 §4)" },
